cradle:
  multi:
    - path: "./src"
      config:
        cradle:
          cabal:
            component: "lib:haskell"
    - path: "./app"
      config:
        cradle:
          cabal:
            component: "exe:haskell"
    - path: "./test"
      config:
        cradle:
          cabal:
            component: "test:haskell-test"
